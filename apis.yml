aid: datacor
name: Datacor
description: >-
  Datacor is an enterprise software company founded in 1981 and headquartered in
  Florham Park, New Jersey, that builds industry-specific business management and
  engineering software for process manufacturers, chemical distributors, and
  animal-nutrition producers. Its business-automation suite spans ERP, CRM, MES,
  WMS, formulation management, BLISS LIMS, regulatory and nutrition labeling, and
  TrackAbout asset tracking, while its engineering line delivers chemical process
  simulation and flow-modeling tools including CHEMCAD, Fathom, Arrow, Impulse,
  and xStream. Datacor serves the petrochemical, refinery, energy, feed, and
  specialty-chemical sectors, and has begun layering AI-driven capabilities across
  its products. The company is backed by Norwest Venture Partners. Datacor does not
  currently publish a public developer portal, API reference, or API specifications;
  this profile captures its verified public identity while the API surface (if any)
  remains behind its customer support portal.
